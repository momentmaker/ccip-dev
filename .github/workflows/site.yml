name: site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/core/**'
      - 'docs/methodology.md'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  schedule:
    - cron: '25 0 * * *'
    - cron: '25 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: site
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ccip-dev/site test
      - run: pnpm --filter @ccip-dev/site build
      - run: pnpm --filter @ccip-dev/site exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

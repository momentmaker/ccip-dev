# Unattributed Chainlink CRE Connect Smart Accounts kept as leads. Each sends USDC over CCIP from a per-wallet ERC1967 proxy whose
# implementation (unverified; 0xE0FDE6d6…, 0x9cB69C0D…) carries the EIP-712 domain "CLLSmartAccount", the fixed domain of CRE Connect
# Smart Accounts (https://docs.chain.link/crec/concepts/eip712-signing). The reports come from a private-registry workflow
# (owner 0x794F828f…, name hash cdb9e78995), since October through Base receiver 0x575De5dD… (a minimal proxy); each report carries one
# signed Operation (USDC approve + Router ccipSend). CRE Connect is in private beta and its tenants are not public, so the
# project behind each account is unknown and these credit nobody. Researched 2026-11-06 (CCIP API, public RPCs, Sourcify, Basescan).
name = "CRE Connect smart accounts (unconfirmed)"
kind = "unknown"
verified = false
spread = false


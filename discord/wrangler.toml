name = "ccip-dev-discord"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "discord.ccip.dev", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "ccip-dev-marines"
database_id = "bf4e122f-08a5-4357-828a-1186fb22a444"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MARINES"
bucket_name = "ccip-dev-marines"

[[services]]
binding = "SITE"
service = "ccip-dev-site"
entrypoint = "LinkMarineCards"

[vars]
DISCORD_SERVERS = "all"
# LinkMarines on Telegram (docs/runbook.md, "LinkMarines on Telegram"). The deploy sets TELEGRAM_BOT from the GitHub variable.
TELEGRAM_BOT = "off"
TELEGRAM_GATE_CHATS = "@ccipdev"
TELEGRAM_STICKER_OWNER_ID = ""

[observability]
enabled = true

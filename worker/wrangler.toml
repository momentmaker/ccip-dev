name = "ccip-dev-data"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["* * * * *", "*/5 * * * *", "0 * * * *", "10 0 * * *", "0 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ccip-dev"
database_id = "bd0b0163-c32a-4993-82ec-fa85f8d21208"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PUBLIC"
bucket_name = "ccip-dev-public"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "ccip-dev-archive"

[vars]
CCIP_API_BASE = "https://api.ccip.chain.link/v2"

[observability]
enabled = true

name = "ccip-dev-data"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["* * * * *", "*/5 * * * *", "0 * * * *", "10 0 * * *", "0 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ccip-dev"
# Local and test value. Task 16 replaces it with the id printed by `wrangler d1 create ccip-dev`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PUBLIC"
bucket_name = "ccip-dev-public"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "ccip-dev-archive"

[vars]
CCIP_API_BASE = "https://api.ccip.chain.link/v2"

[observability]
enabled = true
